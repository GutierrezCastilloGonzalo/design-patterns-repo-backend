server.port=80

# Disable Spring Boot Docker Compose integration
spring.docker.compose.enabled=false

# Database Configuration (Override in deployment)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/academic_repo}
spring.datasource.username=${DATABASE_USERNAME:academicuser}
spring.datasource.password=${DATABASE_PASSWORD:academicpass}

# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false

# Liquibase Migration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# JWT Configuration (override via environment variable)
jwt.secret-key=${JWT_SECRET_KEY}

# Cloudflare R2 Storage Configuration
cloudflare.r2.account-id=${CLOUDFLARE_R2_ACCOUNT_ID:}
cloudflare.r2.access-key-id=${CLOUDFLARE_R2_ACCESS_KEY_ID:}
cloudflare.r2.secret-access-key=${CLOUDFLARE_R2_SECRET_ACCESS_KEY:}
cloudflare.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME:}
cloudflare.r2.public-url=${CLOUDFLARE_R2_PUBLIC_URL:}

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging (reduced for production)
logging.level.root=WARN
logging.level.com.academicrepo=INFO
logging.level.org.hibernate.SQL=OFF

# Terminal
spring.output.ansi.enabled=detect
