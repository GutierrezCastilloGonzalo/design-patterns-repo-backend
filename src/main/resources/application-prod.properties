server.port=80

# Database Configuration (Override in deployment)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/academic_repo}
spring.datasource.username=${DATABASE_USERNAME:academicuser}
spring.datasource.password=${DATABASE_PASSWORD:academicpass}

# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false

# Liquibase Migration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Terminal
spring.output.ansi.enabled=detect
