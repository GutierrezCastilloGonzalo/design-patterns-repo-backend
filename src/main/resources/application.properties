spring.application.name=academic-repo
spring.profiles.active=dev
server.servlet.context-path=/academic/api

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Database configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger/OpenAPI documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

# Pagination
spring.data.web.pageable.one-indexed-parameters=true

# JWT Configuration
jwt.secret-key=YWNhZGVtaWNyZXBvc2l0b3J5c2VjcmV0a2V5Zm9yand0c2lnbmluZ3B1cnBvc2VzYW5kaXRtdXN0YmVhdGxlYXN0MjU2Yml0cw==
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.issuer=academic-repo
